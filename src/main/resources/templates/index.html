<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>나의 가계부</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">💰 심플 가계부</h2>
    <div class="text-end">
        <span class="me-2" th:text="${#authentication.name} + '님 환영합니다!'">사용자</span>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-sm btn-outline-danger">로그아웃</button>
        </form>
    </div>
</div>

<div class="mb-3 text-end">
    <a th:href="@{/download/excel}" class="btn btn-success">
        📊 엑셀로 내보내기
    </a>
</div>

<div class="card mb-4">
    <div class="card-body">
        <form th:action="@{/add}" th:object="${transaction}" method="post" class="row g-3">
            <div class="col-md-3">
                <input type="text" th:field="*{title}" class="form-control" placeholder="내역">
                <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>
            <div class="col-md-2">
                <input type="number" th:field="*{amount}" class="form-control" placeholder="금액" required>
                <div class="text-danger" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
            </div>
            <div class="col-md-2">
                <select th:field="*{type}" class="form-select">
                    <option value="EXPENSE">지출</option>
                    <option value="INCOME">수입</option>
                </select>
                <div class="text-danger" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
            </div>
            <div class="col-md-3">
                <input type="text" th:field="*{category}" class="form-control" placeholder="카테고리">
                <div class="text-danger" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">등록</button>
            </div>
        </form>
    </div>
</div>

<div class="card bg-light mb-3">
    <div class="card-body">
        <form method="get" th:action="@{/}" class="row g-2">
            <div class="col-md-3">
                <input type="date" name="startDate" th:value="${startDate}" class="form-control">
            </div>
            <div class="col-md-3">
                <input type="date" name="endDate" th:value="${endDate}" class="form-control">
            </div>
            <div class="col-md-3">
                <input type="text" name="category" th:value="${category}" class="form-control" placeholder="카테고리 검색">
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-secondary w-100">검색</button>
            </div>
        </form>
    </div>
</div>

<div class="row mb-4">
    <div class="col-md-6">
        <div class="card bg-success text-white">
            <div class="card-body">
                <h5>총 수입: <span th:text="${#numbers.formatInteger(totalIncome, 0, 'COMMA')} + '원'">0원</span></h5>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card bg-danger text-white">
            <div class="card-body">
                <h5>총 지출: <span th:text="${#numbers.formatInteger(totalExpense, 0, 'COMMA')} + '원'">0원</span></h5>
            </div>
        </div>
    </div>
</div>

<table class="table table-striped">
    <thead class="table-dark">
    <tr>
        <th>날짜</th>
        <th>내역</th>
        <th>카테고리</th>
        <th>유형</th>
        <th>금액</th>
        <th>액션</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${transactions}">
        <td th:text="${#temporals.format(item.regDate, 'yyyy-MM-dd HH:mm')}">2024-01-01</td>
        <td th:text="${item.title}">식비</td>
        <td th:text="${item.category}">식사</td>
        <td>
            <span th:text="${item.type == 'INCOME' ? '수입' : '지출'}"
                  th:class="${item.type == 'INCOME' ? 'badge bg-success' : 'badge bg-danger'}">
            </span>
        </td>
        <td th:text="${#numbers.formatInteger(item.amount, 0, 'COMMA')} + '원'">1,000원</td>
        <td>
            <a th:href="@{/delete/{id}(id=${item.id})}"
               class="btn btn-sm btn-outline-secondary"
               onclick="return confirm('정말 삭제하시겠습니까?')">삭제</a>
        </td>
    </tr>
    </tbody>
</table>
<nav aria-label="Page navigation" class="mt-4">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
            <a class="page-link" th:href="@{/(page=${currentPage - 1})}">이전</a>
        </li>

        <li class="page-item"
            th:each="pageNum : ${#numbers.sequence(1, totalPages > 0 ? totalPages : 1)}"
            th:classappend="${pageNum == currentPage} ? 'active'">
            <a class="page-link" th:href="@{/(page=${pageNum})}" th:text="${pageNum}">1</a>
        </li>

        <li class="page-item" th:classappend="${currentPage == totalPages || totalPages == 0} ? 'disabled'">
            <a class="page-link" th:href="@{/(page=${currentPage + 1})}">다음</a>
        </li>
    </ul>
</nav>
</body>
</html>
