<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 심플 가계부</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">💰 가계부 로그인</h3>

                    <div th:if="${param.error}" class="alert alert-danger p-2 small text-center">
                        아이디 또는 비밀번호가 일치하지 않습니다.
                    </div>

                    <div th:if="${param.logout}" class="alert alert-info p-2 small text-center">
                        로그아웃 되었습니다.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">아이디</label>
                            <input type="text" id="username" name="username" class="form-control" placeholder="아이디 입력" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">비밀번호</label>
                            <input type="password" id="password" name="password" class="form-control" placeholder="비밀번호 입력" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">로그인</button>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <p class="small text-muted mb-1">처음이신가요?</p>
                        <a th:href="@{/signup}" class="btn btn-outline-secondary btn-sm w-100">회원가입 하기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
